[project]
name = "measuresoftgram-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.8.0,<2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "watchfiles>=0.21.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--ignore=src/msgram_mcp/server.py"

[tool.coverage.run]
omit = ["src/msgram_mcp/server.py"]