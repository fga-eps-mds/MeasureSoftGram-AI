name: Publish Docker Image

on:
  workflow_call:
    inputs:
      version:
        description: "Versão SemVer completa (ex: 1.2.3)"
        required: true
        type: string
      major:
        description: "Versão Major (ex: 1)"
        required: true
        type: string
      minor:
        description: "Versão Minor (ex: 2)"
        required: true
        type: string
      tag_name:
        description: "Tag Git da release (ex: v1.2.3)"
        required: false
        type: string
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Calcular tags SemVer e SHA para o DockerHub
        id: meta
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_MAJOR: ${{ inputs.major }}
          INPUT_MINOR: ${{ inputs.minor }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          FULL_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${FULL_SHA:0:7}"
          IMAGE="${DOCKERHUB_NAMESPACE}/ai"
          TAGS="${IMAGE}:sha-${SHORT_SHA}"

          VERSION="${INPUT_VERSION}"
          MAJOR="${INPUT_MAJOR}"
          MINOR="${INPUT_MINOR}"

          if [ -z "${VERSION}" ] && [ "${REF_TYPE}" = "tag" ]; then
            CLEAN_VER="${REF_NAME#v}"
            if [[ "${CLEAN_VER}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              VERSION="${CLEAN_VER}"
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
            fi
          fi

          if [ -n "${VERSION}" ]; then
            TAGS="${TAGS},${IMAGE}:${VERSION}"
            TAGS="${TAGS},${IMAGE}:${MAJOR}.${MINOR}"
            if [ "${MAJOR}" -ge 1 ] 2>/dev/null; then
              TAGS="${TAGS},${IMAGE}:${MAJOR}"
            fi
            TAGS="${TAGS},${IMAGE}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Tags calculadas para publicação no DockerHub: ${TAGS}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login no DockerHub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem oficial
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}